<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>TILIT HUD</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font: 500 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
    #pill { display: flex; align-items: center; gap: 10px; max-width: 416px; padding: 10px 18px; border-radius: 22px; color: #f4f4f5; background: rgba(24, 24, 27, .94); }
    #dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #a1a1aa; }
    #text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recording #dot { background: #ef4444; animation: pulse 1.4s ease-in-out infinite; }
    .error #dot { background: #f59e0b; }
    @keyframes pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .recording #dot { animation: none; } }
  </style>
</head>
<body>
  <div id="pill"><span id="dot"></span><span id="text"></span></div>
  <script src="hud.js"></script>
</body>
</html>
